name: XeniosAI Product CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [product-first-mvp]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build product and verify architecture
        run: npm run build
      - name: Run tests
        run: npm test
